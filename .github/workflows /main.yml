name: Mutan Kernel ORI Build (Peridot)

on:
  push:
    branches: [ antergos-v6.1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git curl zip \
          libssl-dev libncurses-dev libelf-dev pahole device-tree-compiler

      - name: Setup Clang (Stable)
        run: |
          mkdir clang && cd clang
          curl -LO https://github.com/ZyCromerZ/Clang/releases/download/17.0.0/Clang-17.0.0.tar.gz
          tar -xf *.tar.gz
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Prepare Config (ORI)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          mkdir -p out

          # PAKAI DEFCONFIG ASLI SAJA
          make O=out peridot_defconfig

          # generate final config
          make O=out olddefconfig

      - name: Build Kernel (ORI)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="Mutan"
          export KBUILD_BUILD_HOST="ORI"
          export CC=clang

          make -j$(nproc --all) O=out \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android-

      - name: Check Output
        run: |
          echo "=== OUTPUT ==="
          ls -lah out/arch/arm64/boot/

          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "❌ Image.gz not found"
            exit 1
          fi

      - name: Setup AnyKernel3 (CLEAN)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1
          cd AnyKernel3

          # minimal edit
          sed -i 's/kernel.string=.*/kernel.string=Mutan Kernel ORI (Peridot)/g' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=peridot/g' anykernel.sh

          cp ../out/arch/arm64/boot/Image.gz .

          ZIP_NAME=MutanKernel-ORI-$(date +%Y%m%d-%H%M).zip
          zip -r9 ../$ZIP_NAME *

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Set Tag
        run: echo "TAG_NAME=ori-$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Mutan Kernel ORI"
          body: |
            ## ORI Kernel Build (Baseline)

            ⚠️ No tweaks
            ⚠️ No KernelSU
            ⚠️ Pure source

            🧠 Commit: ${{ github.sha }}

            Device:
            - Poco F6 (Peridot)
          files: ${{ env.ZIP_NAME }}
